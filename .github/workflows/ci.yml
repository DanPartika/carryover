name: CI

# This app is deployed straight from its default branch onto the Lithe box, so
# the branch itself is the thing worth gating.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: lint
        run: npm run lint
      - name: test
        run: npm run test
      # Mirrors the Dockerfile: `next build` needs no env and no database
      # (the pg pool is lazy), so a green build here means a green image.
      - name: build
        run: npm run build
